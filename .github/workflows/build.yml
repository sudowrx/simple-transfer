name: Build Executables

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            path: dist/SimpleTransferEnhanced
          - os: windows-latest
            name: windows
            path: dist/SimpleTransferEnhanced.exe
          - os: macos-latest
            name: macos
            path: dist/SimpleTransferEnhanced.app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller

      - name: Build ${{ matrix.name }}
        run: pyinstaller --onefile --windowed --name SimpleTransferEnhanced simple-transfer-enhanced.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleTransferEnhanced-${{ matrix.name }}
          path: ${{ matrix.path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare files
        run: |
          APP_DIR=$(find artifacts/SimpleTransferEnhanced-macos -name "Contents" -type d -printf '%h' 2>/dev/null | head -1)
          echo "Found app dir: $APP_DIR"
          if [ -n "$APP_DIR" ] && [ -d "$APP_DIR" ]; then
            printf 'import zipfile, os, sys\napp_dir = sys.argv[1]\nzip_path = sys.argv[2]\nos.chdir(app_dir)\nwith zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as z:\n    for r, d, f in os.walk("."):\n        for file in f:\n            fp = os.path.join(r, file)\n            z.write(fp)\nprint("Created:", zip_path)\n' > /tmp/create_zip.py
            python3 /tmp/create_zip.py "$APP_DIR" "artifacts/SimpleTransferEnhanced-macos.zip"
            ls -lh artifacts/SimpleTransferEnhanced-macos.zip
          else
            echo "ERROR: app not found"
            find artifacts -type d
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## 📥 Downloads

            | Platform | File |
            |----------|------|
            | 🐧 Linux | `SimpleTransferEnhanced` - Run `chmod +x && ./SimpleTransferEnhanced` |
            | 🪟 Windows | `SimpleTransferEnhanced.exe` |
            | 🍎 macOS | `SimpleTransferEnhanced-macos.zip` |

            ## ✨ Features

            - 🔍 Device Discovery - Auto-discover LAN devices
            - 📁 Drag & Drop - Drop files directly to transfer
            - 📋 Batch Transfer - Queue multiple files
            - ⏸️ Resume Support - Continue interrupted transfers
            - 📊 Real-time Progress - Speed and ETA display
            - 🕐 IP History - Quick selection of recent IPs
            - 🌐 Multi-language - Chinese & English
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        run: |
          if [ -f "artifacts/SimpleTransferEnhanced-linux/SimpleTransferEnhanced" ]; then
            gh release upload ${{ github.ref_name }} artifacts/SimpleTransferEnhanced-linux/SimpleTransferEnhanced --clobber
          fi
          if [ -f "artifacts/SimpleTransferEnhanced-windows/SimpleTransferEnhanced.exe" ]; then
            gh release upload ${{ github.ref_name }} artifacts/SimpleTransferEnhanced-windows/SimpleTransferEnhanced.exe --clobber
          fi
          if [ -f "artifacts/SimpleTransferEnhanced-macos.zip" ]; then
            gh release upload ${{ github.ref_name }} artifacts/SimpleTransferEnhanced-macos.zip --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}