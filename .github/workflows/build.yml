name: Build Executables

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            path: dist/SimpleTransferEnhanced
          - os: windows-latest
            name: windows
            path: dist/SimpleTransferEnhanced.exe
          - os: macos-latest
            name: macos
            path: dist/SimpleTransferEnhanced.app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyinstaller

      - name: Build ${{ matrix.name }}
        run: |
          pyinstaller --onefile --windowed --name SimpleTransferEnhanced simple-transfer-enhanced.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleTransferEnhanced-${{ matrix.name }}
          path: ${{ matrix.path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare files
        run: |
          echo "=== Checking artifact structure ==="
          find artifacts/SimpleTransferEnhanced-macos -type f 2>/dev/null | head -20 || echo "No files found"

          echo "=== Finding .app directory ==="
          APP_PATH=$(find artifacts/SimpleTransferEnhanced-macos -name "SimpleTransferEnhanced.app" -type d 2>/dev/null | head -1)
          echo "Found app at: $APP_PATH"

          if [ -n "$APP_PATH" ]; then
            APP_DIR=$(dirname "$APP_PATH")
            echo "Creating zip from $APP_DIR"
            python3 << EOF
import zipfile, os, sys

app_dir = "$APP_DIR"
zip_path = "artifacts/SimpleTransferEnhanced-macos.zip"

print(f"App dir: {app_dir}")
print(f"Zip path: {zip_path}")

os.chdir(app_dir)
with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as z:
    for root, dirs, files in os.walk('.'):
        for f in files:
            fp = os.path.join(root, f)
            z.write(fp)
            print(f"Added: {fp}")
print("Done")
EOF
          else
            echo "ERROR: SimpleTransferEnhanced.app not found"
            find artifacts -type d 2>/dev/null
          fi

          echo "=== Verifying zip ==="
          ls -lh artifacts/SimpleTransferEnhanced-macos.zip 2>/dev/null || echo "Zip not found"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## 📥 Downloads

            | Platform | File |
            |----------|------|
            | 🐧 Linux | `SimpleTransferEnhanced` - Run `chmod +x && ./SimpleTransferEnhanced` |
            | 🪟 Windows | `SimpleTransferEnhanced.exe` |
            | 🍎 macOS | `SimpleTransferEnhanced-macos.zip` |

            ## ✨ Features

            - 🔍 Device Discovery - Auto-discover LAN devices
            - 📁 Drag & Drop - Drop files directly to transfer
            - 📋 Batch Transfer - Queue multiple files
            - ⏸️ Resume Support - Continue interrupted transfers
            - 📊 Real-time Progress - Speed and ETA display
            - 🕐 IP History - Quick selection of recent IPs
            - 🌐 Multi-language - Chinese & English
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        run: |
          echo "=== Uploading Linux ==="
          if [ -f "artifacts/SimpleTransferEnhanced-linux/SimpleTransferEnhanced" ]; then
            gh release upload ${{ github.ref_name }} artifacts/SimpleTransferEnhanced-linux/SimpleTransferEnhanced --clobber || echo "Linux upload failed"
          else
            echo "Linux file not found"
          fi
          echo "=== Uploading Windows ==="
          if [ -f "artifacts/SimpleTransferEnhanced-windows/SimpleTransferEnhanced.exe" ]; then
            gh release upload ${{ github.ref_name }} artifacts/SimpleTransferEnhanced-windows/SimpleTransferEnhanced.exe --clobber || echo "Windows upload failed"
          else
            echo "Windows file not found"
          fi
          echo "=== Uploading macOS ==="
          if [ -f "artifacts/SimpleTransferEnhanced-macos.zip" ]; then
            gh release upload ${{ github.ref_name }} artifacts/SimpleTransferEnhanced-macos.zip --clobber || echo "macOS upload failed"
          else
            echo "macOS zip not found"
            ls -la artifacts/
          fi
          echo "=== Done ==="
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}