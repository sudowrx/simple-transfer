name: Build Executables

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            path: dist/SimpleTransferEnhanced
          - os: windows-latest
            name: windows
            path: dist/SimpleTransferEnhanced.exe
          - os: macos-latest
            name: macos
            path: dist/SimpleTransferEnhanced.app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyinstaller

      - name: Build ${{ matrix.name }}
        run: |
          pyinstaller --onefile --windowed --name SimpleTransferEnhanced simple-transfer-enhanced.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleTransferEnhanced-${{ matrix.name }}
          path: ${{ matrix.path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare files
        run: |
          cd artifacts
          if [ -d "SimpleTransferEnhanced-macos/SimpleTransferEnhanced.app" ]; then
            cd SimpleTransferEnhanced-macos
            zip -r ../SimpleTransferEnhanced-macos.zip SimpleTransferEnhanced.app
            cd ../..
          fi

      - name: Upload to Release
        run: |
          cd artifacts
          if [ -f "SimpleTransferEnhanced-linux/SimpleTransferEnhanced" ]; then
            gh release upload v1.0.0 SimpleTransferEnhanced-linux/SimpleTransferEnhanced --clobber
          fi
          if [ -f "SimpleTransferEnhanced-windows/SimpleTransferEnhanced.exe" ]; then
            gh release upload v1.0.0 SimpleTransferEnhanced-windows/SimpleTransferEnhanced.exe --clobber
          fi
          if [ -f "SimpleTransferEnhanced-macos.zip" ]; then
            gh release upload v1.0.0 SimpleTransferEnhanced-macos.zip --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## 📥 Downloads

            | Platform | File |
            |----------|------|
            | 🐧 Linux | `SimpleTransferEnhanced` - Run `chmod +x && ./SimpleTransferEnhanced` |
            | 🪟 Windows | `SimpleTransferEnhanced.exe` |
            | 🍎 macOS | `SimpleTransferEnhanced-macos.zip` |

            ## ✨ Features

            - 🔍 Device Discovery - Auto-discover LAN devices
            - 📁 Drag & Drop - Drop files directly to transfer
            - 📋 Batch Transfer - Queue multiple files
            - ⏸️ Resume Support - Continue interrupted transfers
            - 📊 Real-time Progress - Speed and ETA display
            - 🕐 IP History - Quick selection of recent IPs
            - 🌐 Multi-language - Chinese & English
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}